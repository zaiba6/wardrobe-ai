<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IHaveNothingToWear.ai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Georgia', serif;
      background: #FAF7F2;
      color: #1C1917;
      padding: 16px;
    }

    h1 {
      font-style: italic;
      font-size: 14px;
      font-weight: 400;
      color: #1C1917;
      margin-bottom: 2px;
    }

    p.sub {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #9B8E84;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* Settings toggle */
    #settingsToggle {
      background: none;
      border: none;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #9B8E84;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
      float: right;
      margin-top: 2px;
    }

    #settingsPanel { display: none; margin-bottom: 12px; }
    #settingsPanel.open { display: block; }

    label {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9B8E84;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid #E3D9CE;
      background: transparent;
      padding: 5px 0;
      font-size: 11px;
      color: #1C1917;
      font-family: system-ui, sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-bottom-color: #B5756A; }

    .row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .row button {
      flex: 1;
      border: none;
      border-radius: 99px;
      padding: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      transition: opacity 0.2s;
    }

    .row button:hover { opacity: 0.85; }
    #saveBtn { background: #1C1917; color: #FAF7F2; }
    #testBtn { background: transparent; border: 1.5px solid #E3D9CE; color: #9B8E84; }

    #status {
      margin-top: 8px;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      text-align: center;
      min-height: 14px;
    }

    .status-ok  { color: #7A9E7A; }
    .status-err { color: #C47A70; }
    .status-mid { color: #9B8E84; }

    hr { border: none; border-top: 1px solid #E3D9CE; margin: 12px 0; }

    /* Recent board */
    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .board-header span {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9B8E84;
    }

    .board-header .count {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #C4B5AC;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      background: #F0EAE2;
      border: 1px solid #E3D9CE;
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }

    .thumb:hover img { transform: scale(1.05); }

    .thumb.new::after {
      content: '✦';
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: 8px;
      color: #B5756A;
      text-shadow: 0 0 4px #FAF7F2;
    }

    .empty-board {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: #C4B5AC;
      font-style: italic;
      text-align: center;
      padding: 14px 0;
    }

    #openApp {
      display: block;
      width: 100%;
      margin-top: 8px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #B5756A;
      padding: 5px;
      border: 1.5px solid #EED9D5;
      border-radius: 99px;
      cursor: pointer;
      background: transparent;
    }

    #openApp:hover { background: #EED9D5; }

    .hint {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #C4B5AC;
      line-height: 1.5;
      text-align: center;
      margin-top: 8px;
    }

    #loadingSpinner {
      text-align: center;
      padding: 14px 0;
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: #C4B5AC;
    }
  </style>
</head>
<body>
  <div style="display:flex; align-items:flex-start; justify-content:space-between;">
    <div>
      <h1>IHaveNothingToWear.ai</h1>
      <p class="sub">inspo saver</p>
    </div>
    <button id="settingsToggle">settings</button>
  </div>

  <!-- Settings panel (collapsed by default) -->
  <div id="settingsPanel">
    <label>your app url</label>
    <input id="urlInput" type="url" placeholder="https://your-app.up.railway.app" />
    <div class="row">
      <button id="saveBtn">save</button>
      <button id="testBtn">test</button>
    </div>
    <div id="status"></div>
    <hr />
  </div>

  <!-- Inspo board -->
  <div class="board-header">
    <span>inspo board</span>
    <span class="count" id="boardCount"></span>
  </div>

  <div id="loadingSpinner">loading…</div>
  <div class="grid" id="recentGrid" style="display:none"></div>
  <div class="empty-board" id="emptyBoard" style="display:none">
    right-click any image →<br><em>"Save to inspo board ✦"</em>
  </div>

  <button id="openApp" style="display:none">open full app →</button>

  <script src="popup.js"></script>
</body>
</html>
